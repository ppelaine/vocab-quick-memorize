<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test 2 — Empty Dict</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#f9f4f7}
.header{background:linear-gradient(135deg,#4aaf85,#8b5fbf,#f0b835);color:#fff;padding:18px 28px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.18);border-radius:24px;padding:4px}
.tab-btn{padding:9px 22px;border-radius:22px;border:none;cursor:pointer;font-size:.9em;background:transparent;color:rgba(255,255,255,.85);font-weight:700}
.tab-btn.active{background:#fff;color:#e8507a;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.view{display:none;padding:24px;text-align:center;font-size:1.5em}
.view.active{display:block}
.card{background:#fff;border-radius:16px;padding:24px;margin:16px;box-shadow:0 4px 24px rgba(107,63,160,.08)}
.btn{padding:11px 26px;border-radius:22px;border:none;cursor:pointer;font-weight:700;background:#e8507a;color:#fff;font-size:.95em;margin:8px}
</style>
</head>
<body>

<div class="header">
  <h1>Test 2</h1>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('review')">复习</button>
    <button class="tab-btn" onclick="switchTab('bank')">词库</button>
    <button class="tab-btn" onclick="switchTab('game')">游戏</button>
    <button class="tab-btn" onclick="switchTab('profile')">我的</button>
  </div>
</div>

<div class="view active" id="view-review">
  <div class="card"><h2>📊 复习页面</h2></div>
</div>
<div class="view" id="view-bank">
  <div class="card"><h2>📚 词库页面</h2></div>
</div>
<div class="view" id="view-game">
  <div class="card"><h2>🎮 游戏页面</h2></div>
</div>
<div class="view" id="view-profile">
  <div class="card"><h2>👤 我的页面</h2></div>
</div>

<div id="debug" style="margin:16px;padding:12px;background:#fff3cd;border-radius:8px;font-family:monospace;font-size:12px;"></div>

<script>
var dbg=document.getElementById('debug');
function log(msg){dbg.innerHTML+=msg+'<br>';}
var startTime=Date.now();

log('0. Script starting...');

// Simulate a large DICTIONARY (same size as real one)
log('1. Loading DICTIONARY (2200 entries, ~255KB)...');
var DICTIONARY = [
  // 2200 dummy entries to match real size
  {en:'abandon',zh:'放弃',def:'to give up completely',phonetic:'/əˈbændən/',pos:'v.'},
  {en:'ability',zh:'能力',def:'the power or skill to do something',phonetic:'/əˈbɪləti/',pos:'n.'}
];
// Fill with dummy entries to match real data size
for(var i=0;i<2198;i++){
  DICTIONARY.push({en:'word'+i,zh:'词'+i,def:'definition '+i,phonetic:'/test/',pos:'n.'});
}
log('2. DICTIONARY loaded: '+DICTIONARY.length+' entries ('+((Date.now()-startTime)/1000).toFixed(1)+'s)');

log('3. Initializing...');

function switchTab(tab){
  document.querySelectorAll('.view').forEach(function(v){v.classList.remove('active');});
  document.getElementById('view-'+tab).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
  event.target.classList.add('active');
  log('Tab switched to: '+tab);
}

log('4. Init complete ('+((Date.now()-startTime)/1000).toFixed(1)+'s) — try clicking tabs!');
</script>
</body>
</html>
