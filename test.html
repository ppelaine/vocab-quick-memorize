<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test</title>
<style>
body{font-family:sans-serif;padding:20px;text-align:center}
.btn{padding:16px 32px;margin:8px;font-size:18px;border-radius:12px;border:none;background:#e8507a;color:#fff;cursor:pointer}
.msg{margin-top:20px;padding:12px;background:#f0f0f0;border-radius:8px;font-family:monospace}
</style>
</head>
<body>
<h2>JS Test</h2>
<button class="btn" onclick="testClick()">点我测试</button>
<div class="msg" id="msg">等待脚本...</div>
<button class="btn" onclick="switchTab('a')" style="background:#6b3fa0">Tab A</button>
<button class="btn" onclick="switchTab('b')" style="background:#4aaf85">Tab B</button>
<div class="msg" id="tabMsg">当前: -</div>

<script>
document.getElementById('msg').textContent='JS: 已加载 ['+new Date().toLocaleTimeString()+']';

function testClick(){
  document.getElementById('msg').textContent='按钮点击成功! '+new Date().toLocaleTimeString();
}

function switchTab(tab){
  document.getElementById('tabMsg').textContent='当前: '+tab+' ['+new Date().toLocaleTimeString()+']';
}

// Test localStorage
try{
  localStorage.setItem('_test','ok');
  var v=localStorage.getItem('_test');
  document.getElementById('msg').textContent+=' | localStorage: '+v;
}catch(e){
  document.getElementById('msg').textContent+=' | localStorage: 不可用 ('+e.message+')';
}
</script>
</body>
</html>
