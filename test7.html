<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test 3 — Load app.js</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#f9f4f7}
.header{background:linear-gradient(135deg,#4aaf85,#8b5fbf,#f0b835);color:#fff;padding:18px 28px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.18);border-radius:24px;padding:4px}
.tab-btn{padding:9px 22px;border-radius:22px;border:none;cursor:pointer;font-size:.9em;background:transparent;color:rgba(255,255,255,.85);font-weight:700}
.tab-btn.active{background:#fff;color:#e8507a;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.view{display:none;padding:24px;text-align:center;font-size:1.5em}
.view.active{display:block}
.card{background:#fff;border-radius:16px;padding:24px;margin:16px;box-shadow:0 4px 24px rgba(107,63,160,.08)}
</style>
</head>
<body>



<svg style="display:none" aria-hidden="true">
  <defs>
    <!-- Bottom nav icons -->
    <symbol id="icon-review" viewBox="0 0 24 24">
      <path d="M2 12a10 10 0 0118-6M22 12a10 10 0 01-18 6"/>
      <polyline points="8 6 2 12 8 6"/>
      <polyline points="16 18 22 12 16 18"/>
    </symbol>
    <symbol id="icon-bank" viewBox="0 0 24 24">
      <path d="M4 19.5A2.5 2.5 0 016.5 17H20"/>
      <path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>

      <line x1="8" y1="10" x2="14" y2="10"/>

    <symbol id="icon-game" viewBox="0 0 24 24">
      <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
    </symbol>
    <symbol id="icon-profile" viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>
    </symbol>

    <!-- Action icons -->
    <symbol id="icon-add" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10"/>
      <line x1="12" y1="8" x2="12" y2="16"/>
      <line x1="8" y1="12" x2="16" y2="12"/>
    </symbol>
    <symbol id="icon-camera" viewBox="0 0 24 24">
      <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/>
      <circle cx="12" cy="13" r="4"/>
    </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
    </symbol>
    <symbol id="icon-dark-mode" viewBox="0 0 24 24">
      <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
    </symbol>
    <symbol id="icon-switch" viewBox="0 0 24 24">
      <polyline points="16 3 21 3 21 8"/>
      <line x1="4" y1="11" x2="21" y2="11"/>
      <polyline points="8 21 3 21 3 16"/>
      <line x1="20" y1="13" x2="3" y2="13"/>
    </symbol>

    <!-- Game icons — Think-style bold geometric -->
    <symbol id="icon-read" viewBox="0 0 24 24">
      <!-- Open book: bold covers, dynamic spread pages -->

      <line x1="8" y1="12" x2="14" y2="12" stroke-width="2.5"/>

    <symbol id="icon-meaning" viewBox="0 0 24 24">
      <!-- Bold eye with insight spark -->
      <ellipse cx="12" cy="12" rx="9" ry="7" fill="currentColor" opacity=".12"/>
      <ellipse cx="12" cy="12" rx="9" ry="7" fill="none" stroke-width="2.5"/>
      <circle cx="12" cy="12" r="3.5" fill="currentColor" opacity=".25"/>
      <circle cx="12" cy="12" r="3.5" fill="none" stroke-width="2.5"/>
      <!-- Sparkle -->
      <path d="M17 5l1.5 3 3 1.5-3 1.5-1.5 3-1.5-3-3-1.5 3-1.5z" fill="currentColor" opacity=".6"/>
    </symbol>
    <symbol id="icon-spell" viewBox="0 0 24 24">
      <!-- Bold pencil with motion -->
      <rect x="4" y="17" width="16" height="2" rx="1" fill="currentColor" opacity=".15"/>
      <path d="M16 2l5 5-3 3-5-5z" fill="currentColor" opacity=".2"/>
      <path d="M16 2l5 5-12 12-5-1-1-5z" fill="none" stroke-width="2.5"/>
      <line x1="12" y1="11" x2="17" y2="6" stroke-width="2"/>

    <!-- Status icons -->
    <symbol id="icon-success" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10" fill="currentColor" opacity=".15"/>
      <polyline points="8 12 11 15 16 9"/>

      <line x1="15" y1="9" x2="9" y2="15"/>
      <line x1="9" y1="9" x2="15" y2="15"/>

      <line x1="12" y1="9" x2="12" y2="13"/>
      <line x1="12" y1="17" x2="12.01" y2="17"/>
    </symbol>

    <!-- Misc icons -->
    <symbol id="icon-upload" viewBox="0 0 24 24">
      <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
      <polyline points="17 8 12 3 7 8"/>
      <line x1="12" y1="3" x2="12" y2="15"/>
    </symbol>
    <symbol id="icon-calendar" viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
      <line x1="16" y1="2" x2="16" y2="6"/>
      <line x1="8" y1="2" x2="8" y2="6"/>
      <line x1="3" y1="10" x2="21" y2="10"/>
    </symbol>
    <symbol id="icon-empty" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10"/>
      <line x1="12" y1="8" x2="12" y2="12"/>
      <line x1="12" y1="16" x2="12.01" y2="16"/>
    </symbol>
    <symbol id="icon-confetti" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10"/>
      <path d="M12 6v6l4 2"/>
    </symbol>
  </defs>
</svg>
<script>
function switchTab(tab){
  document.querySelectorAll('.view').forEach(function(v){v.classList.remove('active');});
  document.getElementById('view-'+tab).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
  event.target.classList.add('active');
}

var s=document.createElement('script');
s.src='app.js';
s.onload=function(){
  document.getElementById('status').innerHTML='✅ app.js loaded OK — '+new Date().toLocaleTimeString();
};
s.onerror=function(){
  document.getElementById('status').innerHTML='❌ app.js FAILED to load — '+new Date().toLocaleTimeString();
};
document.head.appendChild(s);
</script>
</body>
</html>
